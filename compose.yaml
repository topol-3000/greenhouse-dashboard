# Local runtime for the AI Greenhouse Customer Portal.
#
#   docker compose up --build          serve on http://localhost:3000
#   docker compose run --rm test       format, lint, typecheck, unit tests
#   docker compose run --rm e2e        Playwright desktop + narrow viewport
#
# The portal reaches the backend through GREENHOUSE_API_UPSTREAM. It defaults to
# the greenhouse API published on the host, and can be overridden without
# rebuilding the frontend:
#
#   GREENHOUSE_API_UPSTREAM=http://192.168.1.10:8000 docker compose up

services:
  portal:
    build:
      context: .
      target: runtime
    ports:
      # Bound to the loopback interface: this is a local development runtime,
      # not something to expose on the network.
      - "127.0.0.1:${PORTAL_PORT:-3000}:8080"
    environment:
      GREENHOUSE_API_UPSTREAM: ${GREENHOUSE_API_UPSTREAM:-http://host.docker.internal:8000}
    extra_hosts:
      # Linux has no built-in host.docker.internal; this maps it to the gateway
      # so the same default upstream works on Linux, macOS and Windows.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # Reproducible checks in the same Node image the build uses.
  test:
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run format:check && npm run lint && npm run typecheck && npm run test"
    profiles: ["tools"]

  e2e:
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run e2e
    profiles: ["tools"]
